services:
  web:
    build:
      context: .
      args:
        DOCKERHUB_MIRROR: ${DOCKERHUB_MIRROR:-docker.m.daocloud.io}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    container_name: tslldwebsite
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8090}:8000" # 服务器上被占用时改 WEB_PORT 即可
    environment:
      - CACHE_TTL_SECONDS=${CACHE_TTL_SECONDS:-300}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?请在 .env 或环境变量中设置管理密码} # 导航板块管理密码
      - DATA_DIR=/app/data
    volumes:
      - ./data:/app/data # 导航书签数据持久化，重建容器不丢
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/api/health').read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
